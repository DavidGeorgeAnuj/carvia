name: carvia
description: CARVIA — EV Charging App for India
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  provider: ^6.1.0
  google_fonts: ^6.2.0
  go_router: ^13.0.0
  sliding_up_panel: ^2.0.0+1
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
